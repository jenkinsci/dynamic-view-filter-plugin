# See https://github.com/jenkins-infra/.github/blob/master/workflow-templates/cd.yaml
name: cd
on:
  check_run:
    types: [completed]
  workflow_dispatch:

permissions:
  checks: write
  contents: write
  id-token: write

jobs:
  cd:
    name: CD
    uses: jenkins-infra/.github/.github/workflows/jenkins-plugin-cd.yml@master
    secrets: inherit
